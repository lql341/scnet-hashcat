name: Validate skill
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.8'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Offline Python behavior
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tests/test-precheck.py
          python scripts/validate.py
          python scripts/check_adapter.py
      - name: Verify pinned adapter
        if: runner.os == 'Linux'
        run: python scripts/check_adapter.py --online
      - name: Shell syntax and behavior
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for script in scripts/hc scripts/remote/*.sh tests/*.sh; do bash -n "$script"; done
          bash tests/test-driver.sh
          bash tests/test-remote.sh
      - name: Repository hygiene
        shell: bash
        run: |
          git diff --check
          if git grep -nE 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|(^|[[:space:]])(export[[:space:]]+)?(API_KEY|ACCESS_KEY|SECRET_KEY|TOKEN|PASSWORD)[[:space:]]*=[[:space:]]*[^<[:space:]]+' -- ':!*.md' ':!.github/**'; then
            echo "suspected credential in repository" >&2
            exit 1
          fi
